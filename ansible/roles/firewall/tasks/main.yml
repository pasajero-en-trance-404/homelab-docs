# Rol: firewall
#
# ESTADO: PLANIFICADO (no activo)
# Migración progresiva desde bootstrap.sh, pasos [6/9] y [7/9].
#
# Pendiente de migrar:
#   - Copiar restore-docker-user.sh a /usr/local/sbin
#   - Instalar docker-user-restore.service y habilitarlo
#   - Aplicar reglas DOCKER-USER
#
# Referencia actual (fuente de verdad):
#   bootstrap/bootstrap.sh → funciones install_systemd_units() y apply_firewall()
#   compose/firewall/restore-docker-user.sh
---
- name: Copiar script de firewall
  ansible.builtin.copy:
    src: "{{ homelab_repo | default('/home/administrador/homelab-docs') }}/compose/firewall/restore-docker-user.sh"
    dest: /usr/local/sbin/restore-docker-user.sh
    mode: "0755"
    owner: root
    group: root

- name: Instalar unit de restauración del firewall
  ansible.builtin.copy:
    src: "{{ homelab_repo | default('/home/administrador/homelab-docs') }}/compose/firewall/docker-user-restore.service"
    dest: /etc/systemd/system/docker-user-restore.service
    mode: "0644"

- name: Habilitar y ejecutar restauración del firewall
  ansible.builtin.systemd:
    name: docker-user-restore.service
    state: started
    enabled: true
    daemon_reload: true
