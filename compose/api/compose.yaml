services:
  api:
    build: .
    container_name: api
    hostname: debian-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    networks:
      - homelab

networks:
  homelab:
    external: true
