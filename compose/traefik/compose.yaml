services:
  traefik:
    image: traefik:v3.7.9
    container_name: traefik
    restart: unless-stopped
    ports:
      - target: 80
        published: "80"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: ${LAN_BIND_IP:?Set LAN_BIND_IP in compose/traefik/.env}
        protocol: tcp
    volumes:
      - ./traefik.yml:/traefik.yml:ro
      - /home/administrador/homelab-data/traefik:/data
      - ./dynamic:/etc/traefik/dynamic:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Set TLS_CERT_DIR in compose/traefik/.env}
        target: /certs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - homelab

networks:
  homelab:
    external: true
